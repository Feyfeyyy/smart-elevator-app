[project]
name = "elevator"
version = "0.1.0"
description = ""
authors = [
    { name = "Feyaaz", email = "feyaazc94@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn>=0.23.2,<0.24",
    "fastapi>=0.103.2,<0.104",
]

[dependency-groups]
dev = [
    "black>=23.10.0,<24",
    "coverage>=7.3.2,<8",
    "httpx>=0.27.2,<0.28",
    "isort>=5.12.0,<6",
    "pytest-asyncio>=0.21.1,<0.22",
    "pytest>=7.4.2,<8",
    "ruff>=0.1.2,<0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["backend", "main"]
branch = true

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
select = ["ALL"]
ignore = ["A003", "D400","D203", "D212", "D407", "D415", "E501", "ERA001", "FIX002",
    "FBT00", "I001", "INP001", "N805", "PLW0603", "RET505", "S101", "TD002", "TD003"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN",
    "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC",
    "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM",
    "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.11.
target-version = "py311"

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "ANN101",
    "D100",
    "D101",
    "D102",
    "D104",
]

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.coverage.report]
omit = [
    "tests/*",
]
show_missing = true
