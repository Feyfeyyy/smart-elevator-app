name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elevator_backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: elevator_backend/uv.lock
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run coverage run -m pytest tests

      - name: Report coverage
        run: uv run coverage report

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: elevator_backend/uv.lock
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: elevator_frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: elevator_backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: elevator_frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: elevator_frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: elevator_frontend
        run: npm run test:e2e
